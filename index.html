<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BH Salon - نظام الكاشير والمزامنة السحابية</title>
    <!-- مكتبات Bootstrap 5 (RTL) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <!-- مكتبات Firebase السحابية (نسخة متوافقة Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        body { background-color: #f8f9fa; font-family: Tahoma, sans-serif; }
        .container { max-width: 600px; margin-top: 20px; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="container">
    <h3 class="text-center mb-4">✨ BH Salon - كاشير الصالون ✨</h3>
    
    <!-- نموذج تسجيل فاتورة أو خدمة -->
    <div class="mb-3">
        <label class="form-label">اسم العميلـة:</label>
        <input type="text" id="custName" class="form-control" placeholder="أدخل اسم العميلـة">
    </div>
    
    <div class="mb-3">
        <label class="form-label">رقم الهاتف:</label>
        <input type="text" id="custPhone" class="form-control" placeholder="رقم الهاتف">
    </div>

    <div class="mb-3">
        <label class="form-label">المبلغ الإجمالي (د.ك):</label>
        <input type="number" id="totalDue" class="form-control" placeholder="0.000">
    </div>

    <button id="saveInvoiceBtn" class="btn btn-success w-100 py-2">حفظ ومزامنة الفاتورة فوراً</button>

    <hr class="my-4">

    <h5>📋 سجل الفواتير المتزامن من السحابة:</h5>
    <ul id="invoicesList" class="list-group mt-3">
        <li class="list-group-item text-muted text-center">جاري تحميل البيانات من السحابة...</li>
    </ul>
</div>

<script>
    // 1. إعدادات ربط Firebase الحقيقية الخاصة بك
    const firebaseConfig = {
        apiKey: "AIzaSyCj32hE_3we6AOtIYdrArEUOHY03U96uYQ",
        authDomain: "date-a81ed.firebaseapp.com",
        databaseURL: "https://date-a81ed-default-rtdb.firebaseio.com",
        projectId: "date-a81ed",
        storageBucket: "date-a81ed.appspot.com",
        messagingSenderId: "1080232485188",
        appId: "1:1080232485188:web:7eb7dd853cd026fc5cb711",
        measurementId: "G-FJV29W0YBF"
    };

    // تهيئة Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. زر الحفظ والإرسال الفوري للسحابة
    document.getElementById('saveInvoiceBtn').addEventListener('click', function() {
        let name = document.getElementById('custName').value.trim();
        let phone = document.getElementById('custPhone').value.trim();
        let total = document.getElementById('totalDue').value.trim();

        if(!name || !total) {
            alert("يرجى كتابة اسم العميلـة والمبلغ على الأقل!");
            return;
        }

        let invoiceData = {
            clientName: name,
            phone: phone,
            total: total,
            time: new Date().toLocaleTimeString('ar-KW')
        };

        // دفع وحفظ البيانات في قاعدة البيانات السحابية Realtime Database
        db.ref('bh_salon/invoices').push(invoiceData)
            .then(() => {
                alert("تم الحفظ والمزامنة بنجاح على جميع الأجهزة!");
                document.getElementById('custName').value = '';
                document.getElementById('custPhone').value = '';
                document.getElementById('totalDue').value = '';
            })
            .catch((error) => {
                alert("خطأ في المزامنة: " + error.message);
            });
    });

    // 3. الاستماع الفوري والدائم لأي تغييرات وتحديث الشاشة تلقائياً عبر الأجهزة
    db.ref('bh_salon/invoices').on('value', (snapshot) => {
        let listElement = document.getElementById('invoicesList');
        listElement.innerHTML = '';
        
        let data = snapshot.val();
        if(data) {
            Object.keys(data).forEach(key => {
                let inv = data[key];
                let li = document.createElement('li');
                li.className = 'list-group-item d-flex justify-content-between align-items-center';
                li.innerHTML = `<span><strong>${inv.clientName}</strong> (${inv.phone || 'بدون'})</span>
                                <span class="badge bg-primary rounded-pill">${inv.total} د.ك - ${inv.time}</span>`;
                listElement.prependli ? listElement.prepend(li) : listElement.appendChild(li);
            });
        } else {
            listElement.innerHTML = '<li class="list-group-item text-muted text-center">لا توجد فواتير مسجلة حتى الآن.</li>';
        }
    });
</script>

</body>
</html>
